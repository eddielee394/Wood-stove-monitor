; Stove monitor - WT32-SC01 Plus (ESP32-S3, 16MB flash, 2MB quad PSRAM)

[env:wt32-sc01-plus]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; Match the board's hardware (confirmed via esptool)
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1          ; native USB-Serial/JTAG
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial prints go over the USB cable

monitor_speed = 115200

lib_deps =
    lovyan03/LovyanGFX@^1.1.16