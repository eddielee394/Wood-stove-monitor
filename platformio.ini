; Stove monitor - WT32-SC01 Plus (ESP32-S3, 16MB flash, 2MB quad PSRAM)

[platformio]
default_envs = wt32-sc01-plus

[env:wt32-sc01-plus]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; Match the board's hardware (confirmed via esptool)
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1          ; native USB-Serial/JTAG
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial prints go over the USB cable
    -DLV_CONF_INCLUDE_SIMPLE      ; LVGL config is include/lv_conf.h
    -DLV_LVGL_H_INCLUDE_SIMPLE    ; generated fonts include "lvgl.h"
    -Iinclude

monitor_speed = 115200

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    adafruit/Adafruit MAX31856 library@^1.2.8
    lvgl/lvgl@~9.6.0
    bblanchon/ArduinoJson@^7.2.0
; Over-the-air upload over HTTP (TCP). Use tools/ota-upload.sh, which reads
; the password from ~/.config/stove-monitor/ota_password (never committed).
[env:ota]
extends = env:wt32-sc01-plus
upload_protocol = custom
upload_port = stove-monitor.local
upload_command = curl --fail --show-error -s -u "ota:$$STOVE_OTA_PASSWORD" -F "firmware=@$SOURCE" http://$UPLOAD_PORT/update
